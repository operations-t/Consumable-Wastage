name: Build and deploy dashboard

"on":
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - ".gitattributes"
  workflow_dispatch:

# Least privilege at workflow level; the deploy job widens what it needs.
permissions:
  contents: read

# Never cancel a deployment that is already publishing. Queue instead.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install data reader
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build dashboard data and site
        run: python scripts/build_site.py

      - name: Verify build output
        run: python scripts/verify_build.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist"

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
